services:
  # Fullstack Web Service (Serves Node.js Express API + React Vite SPA Frontend)
  - type: web
    name: autonomous-pm
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_FIREBASE_API_KEY
        value: your_firebase_api_key_here
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: product-management-d2f7e.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: product-management-d2f7e
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: product-management-d2f7e.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "390263177543"
      - key: VITE_FIREBASE_APP_ID
        value: 1:390263177543:web:eced79c963c7834cef4c62
