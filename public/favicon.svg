<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="2.5" />

  <!-- Inner Hexagon Shield -->
  <path d="M 32 12 L 48 21 L 48 39 L 32 48 L 16 39 L 16 21 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Futuristic Core Nodes & PM Wings -->
  <circle cx="32" cy="30" r="4" fill="url(#primaryGrad)" filter="url(#glow)" />
  <path d="M 22 28 L 32 20 L 42 28" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 24 35 L 32 40 L 40 35" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Pulse dots -->
  <circle cx="32" cy="14" r="1.5" fill="#F59E0B" />
  <circle cx="46" cy="22" r="1.5" fill="#6366F1" />
  <circle cx="18" cy="22" r="1.5" fill="#38BDF8" />
</svg>
